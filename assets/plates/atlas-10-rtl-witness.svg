<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc"><title id="title">RTL Witness · 从反例修复 AXI-Stream 位宽转换器</title><desc id="desc">左侧逐拍显示原稿在第二拍拒绝下一个字，修复后连续输出 11、55、66。右侧四条反例将局部改法从 116 个筛到 2 个。冻结候选通过 6,524 拍独立回放、八项端口安全性质证明。</desc><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#263b35}.code{font-family:Consolas,'Liberation Mono','Microsoft YaHei',monospace}.serif{font-family:Georgia,'Times New Roman',serif}</style>
<rect x="0" y="0" width="1080" height="720" rx="0" fill="#faf8f1"/>
<rect x="46" y="33" width="29" height="3" rx="0" fill="#356853"/>
<text x="87" y="41" class="code" font-size="16" font-weight="600" text-anchor="start" style="fill:#566b5f">DGX SPARK   /   AI FOR RTL</text>
<text x="43" y="109" class="serif" font-size="70" font-weight="400" text-anchor="start" style="fill:#233d35">RTL Witness</text>
<text x="46" y="151" class="" font-size="27" font-weight="650" text-anchor="start" style="fill:#233d35">用反例修复 Verilog 转换器的同拍收发逻辑</text>
