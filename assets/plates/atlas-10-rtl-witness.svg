<text x="385" y="631" class="serif" font-size="51" font-weight="400" text-anchor="start" style="fill:#faf8eb">8 / 8</text>
<text x="387" y="665" class="" font-size="19" font-weight="550" text-anchor="start" style="fill:#dce8d6">端口安全性质证明</text>
<text x="707" y="631" class="serif" font-size="51" font-weight="400" text-anchor="start" style="fill:#faf8eb">4 / 4</text>
<text x="709" y="665" class="" font-size="19" font-weight="550" text-anchor="start" style="fill:#dce8d6">协议场景可达</text>
