<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc"><title id="title">RTL Witness · 帧 FIFO 反例</title><desc id="desc">上方是规格到验证的路径；左下重放模型生成 RTL 的首次失败，右下对照参考 RTL 的块 RAM 映射。</desc><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#213e42}.serif{font-family:Georgia,serif}.mono{font-family:Consolas,'Microsoft YaHei',monospace}</style><defs><pattern id="lines" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#c7dcd3"/></pattern></defs><rect width="1080" height="720" fill="#fff"/>
<text x="44" y="49" class="mono" font-size="17" font-weight="650" style="fill:#52746c">ENGINEERING ATLAS   /   RTL GENERATION</text>
<text x="43" y="116" class="serif" font-size="66" font-weight="400" style="fill:#213e42">RTL Witness</text>
<text x="44" y="157" class="" font-size="27" font-weight="600" style="fill:#213e42">从 Verilog 规格到第一个失败时钟沿</text>
