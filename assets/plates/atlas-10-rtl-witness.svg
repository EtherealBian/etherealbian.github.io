<text x="58" y="254" class="mono" font-size="15" font-weight="650" style="fill:#577467">01  SPEC</text>
<text x="58" y="286" class="" font-size="22" font-weight="650" style="fill:#213e42">512 × 33 bit</text>
<text x="58" y="313" class="" font-size="17" font-weight="400" style="fill:#213e42">数据与 TLAST</text>
