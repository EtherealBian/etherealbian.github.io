<text x="795" y="86" class="code" font-size="19" font-weight="600" text-anchor="middle" style="fill:#233d35">2</text>
<rect x="816" y="57" width="35" height="45" rx="3" fill="#a3bba6"/>
<text x="833" y="86" class="code" font-size="19" font-weight="600" text-anchor="middle" style="fill:#233d35">1</text>
<rect x="854" y="57" width="35" height="45" rx="3" fill="#6c9382"/>
<text x="871" y="86" class="code" font-size="19" font-weight="600" text-anchor="middle" style="fill:#233d35">0</text>
