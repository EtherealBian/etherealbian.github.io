<text x="309" y="286" class="" font-size="22" font-weight="650" style="fill:#213e42">Qwen2.5-72B</text>
<text x="309" y="313" class="" font-size="17" font-weight="400" style="fill:#213e42">DGX Spark · Q4_K_M</text>
<path d="M528 280 L545 280" stroke="#476960" stroke-width="2" fill="none"/>
<rect x="546" y="230" width="233" height="99" fill="#eff4f1" stroke="none"/>
<text x="560" y="254" class="mono" font-size="15" font-weight="650" style="fill:#577467">03  SIM</text>
<text x="560" y="286" class="" font-size="22" font-weight="650" style="fill:#213e42">Icarus Verilog</text>
<text x="560" y="313" class="" font-size="17" font-weight="400" style="fill:#213e42">握手与逐拍记分板</text>
<path d="M779 280 L796 280" stroke="#476960" stroke-width="2" fill="none"/>
<rect x="797" y="230" width="233" height="99" fill="#f0f4f6" stroke="none"/>
<text x="811" y="254" class="mono" font-size="15" font-weight="650" style="fill:#577467">04  MAP</text>
<text x="811" y="286" class="" font-size="22" font-weight="650" style="fill:#213e42">Yosys · UltraScale+</text>
<text x="811" y="313" class="" font-size="17" font-weight="400" style="fill:#213e42">检查 RAMB 原语</text>
<path d="M44 352 L1036 352" stroke="#c6d4d0" stroke-width="1" fill="none"/>
<text x="44" y="388" class="mono" font-size="16" font-weight="700" style="fill:#2e7565">B</text>
<text x="78" y="388" class="" font-size="22" font-weight="650" style="fill:#213e42">生成 RTL：首拍被接收，输出有效位未拉高</text>
