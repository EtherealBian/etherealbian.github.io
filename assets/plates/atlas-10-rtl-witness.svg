<text x="695" y="570" class="mono" font-size="34" font-weight="650" style="fill:#2e6755">1 × RAMB18E2</text>
<text x="695" y="609" class="" font-size="18" font-weight="400" style="fill:#213e42">同一规格的人工参考实现</text>
<text x="695" y="635" class="" font-size="18" font-weight="400" style="fill:#213e42">Yosys 综合映射，非上板测量。</text>
