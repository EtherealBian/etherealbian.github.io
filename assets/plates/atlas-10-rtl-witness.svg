<text x="50" y="379" class="" font-size="18" font-weight="400" text-anchor="start" style="fill:#233d35">修前 s_ready</text>
<text x="301" y="379" class="code" font-size="25" font-weight="400" text-anchor="middle" style="fill:#233d35">1</text>
<text x="385" y="379" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#994b32">0</text>
