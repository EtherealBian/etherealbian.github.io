<text x="740" y="128" class="code" font-size="17" font-weight="400" text-anchor="start" style="fill:#566b5f">AXI-Stream  /  32 → 8</text>
<path d="M46 176H1034" fill="none" stroke="#cbd1c2" stroke-width="1.5"/>
<path d="M632 192V553" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="46" y="213" class="code" font-size="18" font-weight="700" text-anchor="start" style="fill:#356853">01</text>
<text x="86" y="214" class="" font-size="23" font-weight="650" text-anchor="start" style="fill:#233d35">同拍交接：哪根信号错了？</text>
<text x="47" y="246" class="" font-size="18" font-weight="400" text-anchor="start" style="fill:#566b5f">上一字发出末字节，下一字同时到达；修前已修正位选语法。</text>
<rect x="346" y="264" width="79" height="230" rx="5" fill="#e9ddca"/>
<text x="50" y="289" class="" font-size="17" font-weight="400" text-anchor="start" style="fill:#566b5f">上升沿</text>
<text x="301" y="289" class="code" font-size="18" font-weight="650" text-anchor="middle" style="fill:#233d35">01</text>
