<text x="301" y="427" class="code" font-size="25" font-weight="400" text-anchor="middle" style="fill:#233d35">1</text>
<text x="385" y="427" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#356853">1</text>
<text x="469" y="427" class="code" font-size="25" font-weight="400" text-anchor="middle" style="fill:#233d35">0</text>
<text x="553" y="427" class="code" font-size="25" font-weight="400" text-anchor="middle" style="fill:#233d35">1</text>
<path d="M48 447H606" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="50" y="475" class="" font-size="18" font-weight="400" text-anchor="start" style="fill:#233d35">修后输出 / HEX</text>
<text x="301" y="475" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#356853">—</text>
<text x="385" y="475" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#356853">11</text>
<text x="469" y="475" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#356853">55</text>
<text x="553" y="475" class="code" font-size="25" font-weight="700" text-anchor="middle" style="fill:#356853">66</text>
<path d="M384 496v12H67" fill="none" stroke="#994b32" stroke-width="1.5"/>
<text x="50" y="539" class="" font-size="19" font-weight="650" text-anchor="start" style="fill:#994b32">第 2 拍：修前拒收，修后接收下一字。</text>
<text x="657" y="213" class="code" font-size="18" font-weight="700" text-anchor="start" style="fill:#356853">02</text>
<text x="698" y="214" class="" font-size="23" font-weight="650" text-anchor="start" style="fill:#233d35">四条反例筛选改法</text>
<text x="658" y="246" class="" font-size="17" font-weight="400" text-anchor="start" style="fill:#566b5f">每轮将首个失败用例重放给剩余候选。</text>
<text x="659" y="295" class="" font-size="18" font-weight="500" text-anchor="start" style="fill:#233d35">末字节背压放行</text>
<text x="1027" y="295" class="code" font-size="24" font-weight="650" text-anchor="end" style="fill:#356853">116 → 24</text>
<path d="M659 309H1028" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="659" y="352" class="" font-size="18" font-weight="500" text-anchor="start" style="fill:#233d35">同拍接收下一字</text>
<text x="1027" y="352" class="code" font-size="24" font-weight="650" text-anchor="end" style="fill:#356853">24 → 6</text>
<path d="M659 366H1028" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="659" y="409" class="" font-size="18" font-weight="500" text-anchor="start" style="fill:#233d35">非包尾字交接</text>
<text x="1027" y="409" class="code" font-size="24" font-weight="650" text-anchor="end" style="fill:#356853">6 → 4</text>
<path d="M659 423H1028" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="659" y="466" class="" font-size="18" font-weight="500" text-anchor="start" style="fill:#233d35">两沿间的复位脉冲</text>
<text x="1027" y="466" class="code" font-size="24" font-weight="650" text-anchor="end" style="fill:#356853">4 → 2</text>
<path d="M659 480H1028" fill="none" stroke="#cbd1c2" stroke-width="1"/>
<text x="658" y="538" class="" font-size="18" font-weight="400" text-anchor="start" style="fill:#566b5f">末轮剩 2 份，按预定顺序验收第 1 份。</text>
<rect x="46" y="570" width="988" height="118" rx="6" fill="#243f35"/>
<text x="69" y="631" class="serif" font-size="51" font-weight="400" text-anchor="start" style="fill:#faf8eb">6,524</text>
