<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc"><title id="title">RTL Witness · FIFO 反例与切片修复</title><desc id="desc">上方是规格到验证的路径；左下重放模型生成 RTL 的首次失败，右下显示三份状态表依次补齐八种收发转移。</desc><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#213e42}.serif{font-family:Georgia,serif}.mono{font-family:Consolas,'Microsoft YaHei',monospace}</style><defs><pattern id="lines" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 9L9 0" stroke="#c7dcd3"/></pattern></defs><rect width="1080" height="720" fill="#fff"/>
