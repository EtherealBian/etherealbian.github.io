<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">KV fork · 一份前缀，两条续写</title>
  <desc id="desc">一束冷光穿过堆叠的金色 KV 快照，分向两块分别标有 A 与 B 的续写单元。玻璃层数和路径长度仅为示意。</desc>
  <defs>
    <linearGradient id="night" x2="1" y2=".82" gradientUnits="objectBoundingBox"><stop stop-color="#0b132c"/><stop offset=".54" stop-color="#191836"/><stop offset="1" stop-color="#0a1b31"/></linearGradient>
    <radialGradient id="stage"><stop stop-color="#575283" stop-opacity=".73"/><stop offset=".63" stop-color="#2d325a" stop-opacity=".57"/><stop offset="1" stop-color="#17243c" stop-opacity="0"/></radialGradient>
    <radialGradient id="amber"><stop stop-color="#ffbc76" stop-opacity=".45"/><stop offset=".5" stop-color="#e88469" stop-opacity=".18"/><stop offset="1" stop-color="#f77c7b" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x2="1" y2=".7"><stop stop-color="#fff1bb"/><stop offset=".25" stop-color="#ffd385"/><stop offset=".62" stop-color="#ec875d"/><stop offset=".94" stop-color="#9e5276"/><stop offset="1" stop-color="#d78e8d"/></linearGradient>
    <linearGradient id="edge" x2="1" y2=".22"><stop stop-color="#b86965"/><stop offset=".44" stop-color="#ffd796"/><stop offset=".63" stop-color="#f59660"/><stop offset="1" stop-color="#733c65"/></linearGradient>
    <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#e3d9ff"/><stop offset=".44" stop-color="#ab99ff"/><stop offset="1" stop-color="#58449d"/></linearGradient>
    <linearGradient id="ice" x2="1" y2="1"><stop stop-color="#d0fffa"/><stop offset=".45" stop-color="#75e6ed"/><stop offset="1" stop-color="#3675ac"/></linearGradient>
    <linearGradient id="in"><stop stop-color="#7cb5ff" stop-opacity="0"/><stop offset=".49" stop-color="#b2c8ff"/><stop offset="1" stop-color="#fff2b7"/></linearGradient>
    <pattern id="grid" width="52" height="30" patternUnits="userSpaceOnUse"><path d="M-26 15 0 0 52 30 78 15 M-26 15 0 30 52 0 78 15" stroke="#9bade0" opacity=".16" fill="none" stroke-width=".7"/></pattern>
    <radialGradient id="fade"><stop stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient><mask id="floor"><ellipse cx="437" cy="313" rx="545" ry="215" fill="url(#fade)"/></mask>
    <filter id="bloom" x="-.3" y="-.4" width="1.6" height="1.8"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="contacts" width="6" height="7" patternUnits="userSpaceOnUse"><path d="M2 2v3" stroke="#ffe6af" stroke-width="1.6"/></pattern>
    <g id="wafer"><path d="m-102 0 99-53 102 53-99 54z" fill="url(#glass)" stroke="#ffdfaa" stroke-width="1.2"/><path d="m-102 0 102 54 99-54v8L0 63-102 9z" fill="url(#edge)"/><path d="M2 0H92V5H2z" transform="matrix(1 -.55 0 1 0 55)" fill="url(#contacts)"/><path d="M-101 8 0 63 99 8" fill="none" stroke="#ffd49b" opacity=".72"/></g>
    <g id="out"><path d="m-66 0 64-35 68 35-64 35z" fill="currentColor" stroke="currentColor"/><path d="m-66 0 68 35 64-35v10L2 47-66 10z" fill="#252440" stroke="currentColor" stroke-width="1.3"/></g>
    <path id="railA" pathLength="100" d="M340 289 449 228Q456 224 464 228L485 239Q491 242 498 238L591 185"/><path id="railB" pathLength="100" d="M340 289 431 338Q440 343 449 338L490 315Q497 311 504 315L541 335Q549 340 557 335L650 284"/>
    <path id="feed" d="M-20 376 70 326Q78 322 86 326L121 345Q129 349 137 345L275 269"/>
    <style>@media(prefers-reduced-motion:no-preference){.signal{stroke-dasharray:8 110;stroke-dashoffset:10;animation:pulse 3.6s ease-in-out 1 both}@keyframes pulse{0%,12%{opacity:0;stroke-dashoffset:100}30%,75%{opacity:1}100%{opacity:0;stroke-dashoffset:-15}}}.signal{opacity:0}</style>
  </defs>
  <rect width="800" height="500" fill="url(#night)"/><ellipse cx="453" cy="289" rx="448" ry="224" fill="url(#stage)"/><rect y="105" width="800" height="395" fill="url(#grid)" mask="url(#floor)"/>
  <g font-family="'Segoe UI',Arial,sans-serif"><text x="43" y="87" fill="#f2f3ff" font-size="62" letter-spacing="-3.7" font-weight="500">KV fork</text><text x="46" y="121" fill="#bdc7dd" font-size="21">1,536 shared tokens</text></g>
  <ellipse cx="302" cy="319" rx="198" ry="101" fill="url(#amber)"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <g stroke="url(#in)" stroke-width="1.9"><use href="#feed" transform="translate(0 -12)"/><use href="#feed" transform="translate(0 -6)"/><use href="#feed"/><use href="#feed" transform="translate(0 6)"/><use href="#feed" transform="translate(0 12)"/></g>
    <g filter="url(#bloom)" stroke-width="6" opacity=".72"><use href="#railA" stroke="#b29cff"/><use href="#railB" stroke="#62eced"/></g>
    <g stroke="#b6a3ff" stroke-width="1.8"><use href="#railA" transform="translate(0 -5)"/><use href="#railA"/><use href="#railA" transform="translate(0 5)"/></g>
    <g stroke="#7de4ed" stroke-width="1.8"><use href="#railB" transform="translate(0 -5)"/><use href="#railB"/><use href="#railB" transform="translate(0 5)"/></g>
    <g class="signal" stroke="#fff" stroke-width="3.5"><use href="#railA"/><use href="#railB"/></g>
  </g>
  <!-- 同一份快照下方的底座；斜投影保持每片缓存的边缘可见。 -->
  <g transform="translate(296 271)">
    <path d="m-115 42 113-62 117 63L2 108z" fill="#17192c" stroke="#a08899"/><path d="m-115 42 117 66 113-65v5L2 114-115 48z" fill="#3c3449"/>
    <use href="#wafer" y="34"/><use href="#wafer" y="20"/><use href="#wafer" y="6"/><use href="#wafer" y="-8"/>
    <g transform="matrix(1 .53 -1 .53 -2 -54)"><rect x="4" y="4" width="79" height="79" rx="3" fill="none" stroke="#fff1c7"/><rect x="11" y="11" width="65" height="65" rx="3" fill="#543844" stroke="#ffe1a2" stroke-width="2"/><rect x="16" y="16" width="55" height="55" rx="1" fill="#432c40"/><text x="43.5" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#ffdab0">KV</text></g>
    <g transform="matrix(1 .53 -1 .53 -2 -54)" fill="none" stroke="#ffeac1" stroke-width=".95"><path d="M5 14H0m5 6H0m5 6H0m5 6H0m5 6H0m5 6H0m5 6H0m5 6H0m5 6H0m5 6H0M82 14h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6m-6 6h6"/></g>
  </g>
  <g transform="translate(592 165)" color="#a893fa"><use href="#out" y="13"/><use href="#out"/><path d="m-65 0 63-34 67 34-63 34z" fill="url(#violet)"/><path d="m-47 0 46-25 48 25-46 25z" fill="none" stroke="#e0d8ff"/><text x="0" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="32" fill="#352854">A</text></g>
  <g transform="translate(653 267)" color="#72d8e8"><use href="#out" y="13"/><use href="#out"/><path d="m-65 0 63-34 67 34-63 34z" fill="url(#ice)"/><path d="m-47 0 46-25 48 25-46 25z" fill="none" stroke="#c7ffff"/><text x="0" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="32" fill="#173e57">B</text></g>
  <g font-family="'Segoe UI',Arial,sans-serif"><path d="M45 427H755" stroke="#8090ae" opacity=".46"/><text x="45" y="464" font-size="21" fill="#e2e4f3">Qwen2.5-32B</text><text x="755" y="464" text-anchor="end" font-size="21" fill="#bacade">BF16 / DGX Spark</text></g>
</svg>
