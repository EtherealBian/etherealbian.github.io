<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
  <title id="title">UAVCount：从逐帧检测到首次计数</title>
  <desc id="desc">四步流程：帧对齐、候选验证、轨迹回补、首次计数。示意窗口 13 至 15 帧内，已计目标回补后不再计数，新目标连续出现三帧使计数加一，孤立候选不计数。前 10 帧预热，每 3 帧判读。156 段半合成视频工程回归：每次判读计算耗时中位数 339 ms；全部判读窗计数完全正确 592/624，留出视频 167/184。</desc>
  <defs>
    <style>
      text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#213d49}
      .serial,.mono{font-family:Consolas,'Courier New',monospace}.serial{font-size:15px;font-weight:700;letter-spacing:1.25px;fill:#466b77}
      .name,.metric{font-family:Georgia,'Times New Roman',serif;font-weight:bold}.name{font-size:55px;fill:#205378}.metric{font-size:44px;fill:#176453}
      .h{font-size:23px;font-weight:700}.sub{font-size:18px;fill:#476270}.small{font-size:16px;fill:#476270}.bold{font-size:19px;font-weight:700}
      .rule{stroke:#b7cbd0;fill:none}.wire{fill:none;stroke:#427591;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .green{fill:#176453}.blue{fill:#235d82}.amber{fill:#805826}.middle{text-anchor:middle}.right{text-anchor:end}
    </style>
    <g id="observed"><circle r="7" fill="#34749a" stroke="#20506f" stroke-width="2"/></g>
    <g id="arrival"><circle r="7" fill="#26826c" stroke="#155b4b" stroke-width="2"/></g>
    <g id="recovery"><path d="m0 -8 8 8 -8 8 -8 -8z" fill="#fff7e9" stroke="#9a6c30" stroke-width="2.5"/></g>
    <g id="miss"><path d="M-5 0h10" stroke="#6c8189" stroke-width="2"/></g>
    <g id="arrow"><path d="M0 0h18m-6 -5 6 5 -6 5" class="wire"/></g>
  </defs>
  <rect width="1200" height="750" fill="#fff"/>
  <!-- Figure header -->
  <text x="30" y="34" class="serial">FIG. 06A  /  COMPUTER VISION</text>
  <text x="1170" y="34" class="serial right">ENGINEERING RECORD  /  UAVCOUNT</text>
  <text x="29" y="93" class="name">UAVCount</text>
  <path d="M350 52v46" class="rule"/>
  <text x="372" y="71" class="h">水岸视频中的无人机计数</text>
  <text x="373" y="97" class="sub">同一目标在三帧里出现，什么时候算一次？</text>
  <path d="M30 115H1170" stroke="#406675" stroke-width="2"/>
  <!-- A. Four stages, with one small mechanism sketch per stage. -->
  <text x="30" y="146" class="serial">A  /  PROCESSING PIPELINE</text>
  <g transform="translate(30 161)">
    <rect width="1140" height="90" rx="5" fill="#eef4f7"/>
    <g transform="translate(14 17)" class="wire"><rect x="2" y="2" width="34" height="34" rx="2" opacity=".4"/><rect x="10" y="9" width="34" height="34" rx="2"/><path d="m14 32 7 -5 7 3 10 -6"/><path d="M17 17h7m-3.5 -3.5v7"/></g>
    <text x="71" y="35" class="h blue">帧间对齐</text><text x="71" y="64" class="small">GPU 滤波，补偿相机运动</text>
    <use href="#arrow" x="259" y="44"/>
    <g transform="translate(298 20)" class="wire"><path d="M3 14V3h10m19 0h10v11m0 16v11H32m-18 0H3V30"/><rect x="12" y="13" width="20" height="15" rx="1"/><path d="M4 35q8 -5 16 -2t19 -3" opacity=".5"/></g>
    <text x="354" y="35" class="h blue">候选验证</text><text x="354" y="64" class="small">YOLO11n · TensorRT FP16</text>
    <use href="#arrow" x="544" y="44"/>
    <g transform="translate(584 24)"><path d="m0 29 19 -15 21 -7" class="wire" stroke-dasharray="4 3"/><use href="#observed" y="29"/><use href="#recovery" x="19" y="14"/><use href="#observed" x="40" y="7"/></g>
    <text x="642" y="35" class="h blue">短轨迹回补</text><text x="642" y="64" class="small">复核弱观测，维持目标身份</text>
    <use href="#arrow" x="830" y="44"/>
    <g transform="translate(866 23)" stroke="#24735f" stroke-width="2.4" fill="none"><path d="M1 35V1h8m32 0h8v34h-8M1 35h8"/><path d="m12 17 8 8L37 8"/></g>
    <text x="930" y="35" class="h green">首次计数</text><text x="930" y="64" class="small">核对历史身份与最近三帧</text>
  </g>
  <!-- B. A shared horizontal axis makes the three outcomes comparable. -->
  <text x="30" y="287" class="serial">B  /  IDENTITY WINDOW</text><text x="30" y="323" class="h">同一判读窗内的三种结果</text>
  <rect x="32" y="342" width="710" height="37" fill="#eef3f5"/>
  <text x="47" y="367" class="small">身份 / 记录</text>
  <g class="mono middle" font-size="17" font-weight="700"><text x="279" y="367">F13</text><text x="380" y="367">F14</text><text x="481" y="367">F15</text></g>
  <text x="574" y="367" class="small">本窗新增</text>
  <g class="rule"><path d="M32 436H742M32 494H742M32 552H742"/><path d="M279 379v173m101 -173v173m101 -173v173" stroke-dasharray="3 6"/></g>
  <g transform="translate(0 407)"><text x="47" y="7" class="bold">已有目标</text><path d="M279 0H481" class="wire" stroke-dasharray="5 5"/><use href="#observed" x="279"/><use href="#recovery" x="380"/><use href="#observed" x="481"/><text x="574" y="7" class="bold blue">0</text><text x="608" y="6" class="small">不重复计数</text></g>
  <g transform="translate(0 465)"><text x="47" y="7" class="bold green">新目标</text><path d="M279 0H481" stroke="#26826c" stroke-width="3"/><use href="#arrival" x="279"/><use href="#arrival" x="380"/><use href="#arrival" x="481"/><rect x="555" y="-20" width="174" height="39" rx="4" fill="#e3f2ea"/><text x="568" y="7" class="bold green">+1</text><text x="608" y="6" class="small green">首次确认</text></g>
  <g transform="translate(0 523)"><text x="47" y="7" class="bold">孤立候选</text><use href="#miss" x="279"/><use href="#observed" x="380"/><use href="#miss" x="481"/><text x="574" y="7" class="bold blue">0</text><text x="608" y="6" class="small">未满三帧</text></g>
  <g transform="translate(44 575)"><use href="#observed"/><text x="16" y="6" class="small">观测</text><use href="#recovery" x="91"/><text x="108" y="6" class="small">轨迹回补</text><use href="#miss" x="218"/><text x="232" y="6" class="small">未观测</text><text x="697" y="6" class="small right">轨迹示意，非实拍</text></g>
  <!-- C. Clock and output for this worked window. -->
  <path d="M767 273v314" class="rule"/>
  <text x="793" y="287" class="serial">C  /  DECISION CADENCE</text><text x="793" y="323" class="h">每三帧输出一次</text>
  <text x="793" y="365" class="sub">帧 0–9 预热，首个窗口为 10–12。</text>
  <text x="793" y="400" class="small">窗口结束帧</text>
  <path d="M807 428h320" class="wire"/><path d="m1119 423 8 5 -8 5" class="wire"/>
  <g class="middle mono" font-size="18"><circle cx="828" cy="428" r="5" fill="#427591"/><text x="828" y="459">12</text><circle cx="912" cy="428" r="9" fill="#26826c"/><circle cx="912" cy="428" r="14" fill="none" stroke="#26826c"/><text x="912" y="459" font-weight="bold" class="green">15</text><circle cx="996" cy="428" r="5" fill="#427591"/><text x="996" y="459">18</text><circle cx="1080" cy="428" r="5" fill="#427591"/><text x="1080" y="459">21</text></g>
  <rect x="793" y="483" width="377" height="75" rx="4" fill="#edf5f0"/>
  <text x="809" y="509" class="serial green">JSONL  /  OUTPUT EXAMPLE</text>
  <text x="809" y="539" class="mono" font-size="19">{"end_frame": 15, "count": 1}</text>
  <!-- D. Evaluation denominators stay adjacent to their exact-match rates. -->
  <path d="M30 606H1170" stroke="#406675" stroke-width="2"/>
  <text x="30" y="635" class="serial">D  /  ENGINEERING REGRESSION</text><text x="1170" y="635" class="small right">156 段半合成视频 · 按判读窗统计</text>
  <path d="M390 653v74m400 -74v74" class="rule"/>
  <text x="30" y="689" class="metric">339 <tspan font-size="28">ms</tspan></text><text x="31" y="721" class="sub">每个三帧判读窗的计算耗时中位数</text>
  <text x="418" y="689" class="metric">94.87%</text><text x="419" y="721" class="sub">全部窗口 · 592 / 624 个计数完全正确</text>
  <text x="818" y="689" class="metric">90.76%</text><text x="819" y="721" class="sub">留出视频 · 167 / 184 个窗口计数完全正确</text>
</svg>