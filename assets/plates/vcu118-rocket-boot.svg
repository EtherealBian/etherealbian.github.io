<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Rocket / VCU118 — from reset vector to Linux</title><desc id="desc">Reset starts a five-stage Rocket. ROM reads SDHC over SPI, checks the GPT and payload CRCs, and hands off to OpenSBI at 0x80000000. The Linux kernel entry is 0x80200000.</desc>
  <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dedbd1" stroke-width=".6"/></pattern><marker id="arr" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 7 3.5 0 7z" fill="#244e45"/></marker></defs>
  <rect width="800" height="500" fill="#f7f5eb"/><rect width="800" height="500" fill="url(#grid)"/>
  <g font-family="ui-monospace, Consolas, monospace" fill="#262d2b"><path d="M42 54H758" stroke="#343d39"/><text x="42" y="39" font-size="14" letter-spacing="1.8">ENGINEERING RECORD / 09</text><text x="758" y="39" font-size="14" text-anchor="end">VCU118 · XCVU9P</text>
  <text x="41" y="111" font-family="Georgia,serif" font-size="46">From reset to Linux.</text><text x="44" y="140" fill="#52635b" font-size="16">ROCKET / RV64GC  ·  MACHINE → SUPERVISOR</text>
  <text x="45" y="187" font-size="14" fill="#244e45">01 / FIVE-STAGE CORE</text><g stroke="#244e45" fill="#e1e9e0"><rect x="44" y="202" width="140" height="54"/><rect x="187" y="202" width="140" height="54"/><rect x="330" y="202" width="140" height="54"/><rect x="473" y="202" width="140" height="54"/><rect x="616" y="202" width="140" height="54"/></g><g font-size="19" text-anchor="middle"><text x="114" y="235">Fetch</text><text x="257" y="235">Decode</text><text x="400" y="235">Execute</text><text x="543" y="235">Memory</text><text x="686" y="235">Writeback</text></g>
  <text x="45" y="306" font-size="14" fill="#244e45">02 / SD BOOT PATH</text><g fill="#fffcf2" stroke="#244e45" stroke-width="2"><rect x="44" y="327" width="191" height="78"/><rect x="305" y="327" width="190" height="78"/><rect x="565" y="327" width="191" height="78"/></g><g stroke="#244e45" stroke-width="2" marker-end="url(#arr)"><path d="M237 366h64"/><path d="M497 366h64"/></g>
  <g text-anchor="middle"><g font-family="Georgia,serif" font-size="25"><text x="140" y="360">Boot ROM</text><text x="400" y="360">OpenSBI</text><text x="660" y="360">Linux</text></g><g font-size="15" fill="#525e57"><text x="140" y="385">0x00010000</text><text x="400" y="385">0x80000000</text><text x="660" y="385">0x80200000</text></g></g>
  <path d="M42 444H758" stroke="#69726a"/><text x="43" y="470" font-size="14" fill="#48544d">SPI SDHC → DDR4</text><text x="757" y="470" text-anchor="end" font-size="14" fill="#48544d">ARCHITECTURE / NOT A TIMING TRACE</text></g></svg>
